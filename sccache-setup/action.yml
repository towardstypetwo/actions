name: sccache setup
description: >-
  Download a pinned johnkferguson/sccache release binary, or build the fork
  at a pinned commit when that fails, start its server on the shared R2
  bucket and set RUSTC_WRAPPER. Without credentials, or if sccache fails to
  install or start, the job builds without it. Use after Swatinem/rust-cache,
  whose key includes RUSTC_WRAPPER.
inputs:
  access-key-id:
    description: R2 access key ID. Empty when the job gets no secrets.
    default: ''
  secret-access-key:
    description: R2 secret access key. Empty when the job gets no secrets.
    default: ''
  account-id:
    description: Cloudflare account ID, for the R2 endpoint.
    default: ''
  endpoint:
    description: >-
      S3 endpoint to use instead of the R2 one account-id names, such as a
      local S3 server in a test.
    default: ''
  release:
    description: >-
      Release tag of johnkferguson/sccache to download on Linux X64 runners.
      Empty builds rev instead.
    default: v0.19.0-fork.1
  release-sha256:
    description: >-
      SHA-256 of the release's x86_64-unknown-linux-musl tarball. A mismatch
      builds rev instead.
    default: c9fc025aa70aeb7bf942035f82b02ad3b0748d8b20dba59b051cccee7d4fe205
  rev:
    description: >-
      Commit of johnkferguson/sccache to build when the release can't be
      used, such as on macOS. Keep it on the source the release was built
      from.
    default: 629401a732ad3731caf121f5bab54b0c9fb4f211
  strict:
    description: >-
      Whether a failure to get sccache running is recorded in
      SCCACHE_STRICT_ERROR, for the job to fail on after its tests. Fork pull
      requests and Dependabot runs, which get no secrets, are exempt from the
      credential check.
    default: 'false'
outputs:
  binary-source:
    description: >-
      Where the sccache binary came from: release, cache or build. Empty
      without credentials or when the build failed.
    value: >-
      ${{ steps.download.outputs.source
      || (steps.bin.outputs.cache-hit == 'true' && 'cache')
      || steps.build.outputs.source }}
  binary-cache-hit:
    description: >-
      Whether the cache of the built sccache binary had an exact match for
      its key. Empty without credentials or when the release was used.
    value: ${{ steps.bin.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Check for R2 credentials
      id: creds
      shell: bash
      env:
        KEY_ID: ${{ inputs.access-key-id }}
        SECRET: ${{ inputs.secret-access-key }}
        ACCOUNT_ID: ${{ inputs.account-id }}
        ENDPOINT: ${{ inputs.endpoint }}
        STRICT: ${{ inputs.strict }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        case $STRICT in
          true | false) ;;
          *)
            echo "::error::strict is '$STRICT'; use true or false"
            exit 1
            ;;
        esac
        skip() {
          if [ "$STRICT" = true ]; then
            echo "::warning::$1, so this job builds without sccache."
            echo "SCCACHE_STRICT_ERROR=$1." >>"$GITHUB_ENV"
          else
            echo "::warning::$1, so this job builds without sccache."
          fi
        }
        if [ -n "$ENDPOINT" ]; then
          endpoint=$ENDPOINT
        elif [ -n "$ACCOUNT_ID" ]; then
          endpoint=https://$ACCOUNT_ID.r2.cloudflarestorage.com
        else
          endpoint=
        fi
        if [ "$RUNNER_OS" != Linux ] && [ "$RUNNER_OS" != macOS ]; then
          skip "sccache-setup runs on Linux and macOS, not $RUNNER_OS"
        elif [ -z "$KEY_ID" ] || [ -z "$SECRET" ]; then
          if [ "$GITHUB_ACTOR" = 'dependabot[bot]' ] \
            || { [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; }; then
            # Fork pull requests and Dependabot get no secrets, even when
            # strict.
            echo "::notice::No R2 credentials, so this job builds without sccache."
          else
            skip "No R2 credentials reached sccache-setup"
          fi
        elif [ -z "$endpoint" ]; then
          skip "Neither account-id nor endpoint is set"
        else
          {
            echo "ok=true"
            echo "endpoint=$endpoint"
            # A changed action, such as a new build command, rebuilds the
            # binary.
            echo "action-hash=$(sha256sum <"$GITHUB_ACTION_PATH/action.yml" | cut -d' ' -f1)"
          } >>"$GITHUB_OUTPUT"
        fi
    - name: Download sccache release
      if: >-
        steps.creds.outputs.ok == 'true' && inputs.release != ''
        && runner.os == 'Linux' && runner.arch == 'X64'
      id: download
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        SHA256: ${{ inputs.release-sha256 }}
      run: |
        name=sccache-$RELEASE-x86_64-unknown-linux-musl
        dir=$RUNNER_TEMP/sccache-release
        rm -rf "$dir"
        mkdir -p "$dir/bin"
        fail() {
          echo "::warning::$1, so sccache-setup builds the fork from source."
          exit 0
        }
        curl -fsSL --retry 3 --max-time 120 -o "$dir/$name.tar.gz" \
          "https://github.com/johnkferguson/sccache/releases/download/$RELEASE/$name.tar.gz" \
          || fail "The sccache release $RELEASE failed to download"
        echo "$SHA256  $dir/$name.tar.gz" | sha256sum -c --quiet \
          || fail "The sccache release $RELEASE doesn't match release-sha256"
        tar -xzf "$dir/$name.tar.gz" -C "$dir" "$name/sccache" \
          || fail "The sccache release $RELEASE has no $name/sccache"
        mv "$dir/$name/sccache" "$dir/bin/sccache"
        "$dir/bin/sccache" --version || fail "The sccache release $RELEASE doesn't run"
        rm -rf ~/.sccache-fork
        mkdir -p ~/.sccache-fork
        mv "$dir/bin" ~/.sccache-fork/bin
        echo "source=release" >>"$GITHUB_OUTPUT"
    - name: Restore sccache binary
      if: steps.creds.outputs.ok == 'true' && steps.download.outputs.source != 'release'
      id: bin
      uses: actions/cache@v6.1.0
      with:
        path: ~/.sccache-fork
        key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rev }}-s3-${{ steps.creds.outputs.action-hash }}
    - name: Build sccache
      if: >-
        steps.creds.outputs.ok == 'true' && steps.download.outputs.source != 'release'
        && steps.bin.outputs.cache-hit != 'true'
      id: build
      shell: bash
      env:
        REV: ${{ inputs.rev }}
        STRICT: ${{ inputs.strict }}
      run: |
        # Outside the workspace, so its rust-toolchain.toml doesn't pick the
        # toolchain that builds sccache.
        cd "$RUNNER_TEMP" || exit
        if cargo install --locked --root "$RUNNER_TEMP/sccache-build" \
          --git https://github.com/johnkferguson/sccache --rev "$REV" \
          --no-default-features --features s3 sccache; then
          mv "$RUNNER_TEMP/sccache-build" ~/.sccache-fork
          echo "source=build" >>"$GITHUB_OUTPUT"
        else
          echo "::warning::sccache failed to build, so this job builds without it."
          if [ "$STRICT" = true ]; then
            echo "SCCACHE_STRICT_ERROR=sccache failed to build at $REV." >>"$GITHUB_ENV"
          fi
        fi
    - name: Start sccache
      if: steps.creds.outputs.ok == 'true'
      shell: bash
      env:
        SCCACHE_BUCKET: tt2-builds
        SCCACHE_ENDPOINT: ${{ steps.creds.outputs.endpoint }}
        SCCACHE_REGION: auto
        SCCACHE_S3_KEY_PREFIX: sccache/
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        SCCACHE_IDLE_TIMEOUT: 0
        SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache.log
        STRICT: ${{ inputs.strict }}
      run: |
        sccache=~/.sccache-fork/bin/sccache
        # The download and build steps already reported their failures.
        [ -x "$sccache" ] || exit 0
        export SCCACHE_BASEDIRS="$GITHUB_WORKSPACE:${CARGO_HOME:-$HOME/.cargo}"
        if ! "$sccache" --start-server; then
          cat "$SCCACHE_ERROR_LOG" 2>/dev/null || true
          echo "::warning::sccache failed to start, so this job builds without it."
          if [ "$STRICT" = true ] && [ -z "${SCCACHE_STRICT_ERROR:-}" ]; then
            echo "SCCACHE_STRICT_ERROR=sccache failed to start." >>"$GITHUB_ENV"
          fi
          exit 0
        fi
        "$sccache" --show-stats || true
        echo "$HOME/.sccache-fork/bin" >>"$GITHUB_PATH"
        echo "RUSTC_WRAPPER=sccache" >>"$GITHUB_ENV"
