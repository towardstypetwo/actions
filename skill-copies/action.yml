name: skill copies
description: >-
  Fail when .agents/skills differs from .claude/skills, comparing every file's
  path, contents and mode, and print the files that differ.
inputs:
  rev:
    description: >-
      Commit to compare the two directories at. The default, HEAD, is the
      checked-out commit. Any other commit must already be fetched.
    default: HEAD
  fix:
    description: >-
      Text printed after the differing files, saying how to fix them. The
      default tells the reader to copy each changed file to the other
      directory.
    default: ''
  path:
    description: Directory of the git repository to check.
    default: .
runs:
  using: composite
  steps:
    - name: Compare .claude/skills with .agents/skills
      shell: bash
      env:
        REV: ${{ inputs.rev }}
        FIX: ${{ inputs.fix }}
      working-directory: ${{ inputs.path }}
      run: bash "$GITHUB_ACTION_PATH/check.sh" "$REV"
